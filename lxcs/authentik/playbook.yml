- name: Setup Authentik
  hosts: all
  become: yes
  vars:
    consul_version: "1.20.1"
  tasks:
    - name: Install dependencies
      apt:
        name: [curl, wget, unzip, jq, ca-certificates, gnupg]
        state: present
        update_cache: yes

    - name: Install Docker
      shell: "curl -fsSL https://get.docker.com | sh"
      args:
        creates: /usr/bin/docker

    - name: Ensure Docker is started
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install Consul
      unarchive:
        src: "https://releases.hashicorp.com/consul/{{ consul_version }}/consul_{{ consul_version }}_linux_amd64.zip"
        dest: /usr/local/bin
        remote_src: yes
        mode: "0755"
        creates: /usr/local/bin/consul

    - name: Create Consul user
      user:
        name: consul
        system: yes
        home: /etc/consul.d
        shell: /sbin/nologin

    - name: Create Consul directories
      file:
        path: "{{ item }}"
        state: directory
        owner: consul
        group: consul
      loop: [/etc/consul.d, /var/lib/consul]

    - name: Configure Consul
      copy:
        dest: /etc/consul.d/consul.hcl
        content: |
          datacenter = "homelab"
          data_dir   = "/var/lib/consul"
          log_level  = "INFO"
          retry_join = ["{{ consul_ip }}"]
          bind_addr  = "{{ ansible_default_ipv4.address }}"
        owner: consul
        group: consul

    - name: Install Consul systemd service
      copy:
        dest: /etc/systemd/system/consul.service
        content: |
          [Unit]
          Description=Consul Agent
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=consul
          Group=consul
          ExecStart=/usr/local/bin/consul agent -config-dir=/etc/consul.d/
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target

    - name: Enable and start Consul
      systemd:
        name: consul
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Create Authentik directory
      file:
        path: /opt/authentik
        state: directory

    # /opt/authentik/.env is deliberately NOT written here. It holds five
    # secrets, and ansibleProvision JSON-encodes its extraVars, which cannot
    # carry a pulumi.Output — stringifying one yields Pulumi's "Calling
    # [toJSON] on an [Output<T>] is not supported" message, which lands in the
    # file as prose and makes `docker compose` fail with "key cannot contain a
    # space". Pulumi writes it over SSH instead (see lxcs/authentik/index.ts),
    # and starts the stack once it is in place.

    - name: Write Docker Compose file
      copy:
        dest: /opt/authentik/docker-compose.yml
        content: |
          services:
            postgresql:
              image: docker.io/library/postgres:16-alpine
              restart: unless-stopped
              # Literal db/user rather than ${POSTGRES_DB}/${POSTGRES_USER}:
              # compose interpolates ${...} from the .env at parse time, not
              # from this service's own environment block, so those would
              # expand to nothing and pg_isready would never report healthy.
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
                start_period: 20s
                interval: 10s
                timeout: 5s
                retries: 10
              volumes: [database:/var/lib/postgresql/data]
              environment:
                POSTGRES_PASSWORD: ${PG_PASS}
                POSTGRES_USER: authentik
                POSTGRES_DB: authentik
            redis:
              image: docker.io/library/redis:alpine
              restart: unless-stopped
              # server and worker both wait on redis with condition:
              # service_healthy, and compose refuses to start a dependency that
              # declares no healthcheck at all.
              healthcheck:
                test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
                start_period: 20s
                interval: 10s
                timeout: 3s
                retries: 10
              volumes: [redis:/data]
            server:
              image: ghcr.io/goauthentik/server:latest
              restart: unless-stopped
              command: server
              environment:
                AUTHENTIK_REDIS__HOST: redis
                AUTHENTIK_POSTGRESQL__HOST: postgresql
                AUTHENTIK_POSTGRESQL__USER: authentik
                AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
                AUTHENTIK_POSTGRESQL__NAME: authentik
                AUTHENTIK_SECRET_KEY: ${SECRET_KEY}
                AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
                AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
                AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
              volumes: [media:/media, custom-templates:/templates]
              ports: ["9000:9000", "9443:9443"]
              depends_on:
                postgresql: { condition: service_healthy }
                redis: { condition: service_healthy }
            worker:
              image: ghcr.io/goauthentik/server:latest
              restart: unless-stopped
              command: worker
              environment:
                AUTHENTIK_REDIS__HOST: redis
                AUTHENTIK_POSTGRESQL__HOST: postgresql
                AUTHENTIK_POSTGRESQL__USER: authentik
                AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
                AUTHENTIK_POSTGRESQL__NAME: authentik
                AUTHENTIK_SECRET_KEY: ${SECRET_KEY}
              user: root
              volumes: [/var/run/docker.sock:/var/run/docker.sock, media:/media, certs:/certs, custom-templates:/templates]
              depends_on:
                postgresql: { condition: service_healthy }
                redis: { condition: service_healthy }
          volumes: { database: {}, redis: {}, media: {}, certs: {}, custom-templates: {} }

    # Starting the stack is the credentials step's job — it is the one that
    # knows .env is present and current.
