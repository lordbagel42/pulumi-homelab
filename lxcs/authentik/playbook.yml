- name: Setup Authentik
  hosts: all
  become: yes
  vars:
    consul_version: "1.20.1" # Example, should probably be passed in
  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - wget
           - unzip
          - jq
          - ca-certificates
          - gnupg
        state: present
        update_cache: yes

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker"

    - name: Ensure Docker is started
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install Consul
      block:
        - name: Download Consul
          get_url:
            url: "https://releases.hashicorp.com/consul/{{ consul_version }}/consul_{{ consul_version }}_linux_amd64.zip"
            dest: /tmp/consul.zip
        - name: Unzip Consul
          unarchive:
            src: /tmp/consul.zip
            dest: /usr/local/bin
            remote_src: yes
            mode: '0755'
        - name: Cleanup zip
          file:
            path: /tmp/consul.zip
            state: absent
      when: not (ansible_check_mode or (stat_consul.stat.exists | default(false)))
      vars:
        stat_consul: "{{ lookup('pipe', 'ls /usr/local/bin/consul', errors='ignore') }}"

    - name: Create Consul user
      user:
        name: consul
        system: yes
        home: /etc/consul.d
        shell: /sbin/nologin

    - name: Create Consul directories
      file:
        path: "{{ item }}"
        state: directory
        owner: consul
        group: consul
      with_items:
        - /etc/consuld
        - /var/lib/consul

