- name: Setup Hashistack Component
  hosts: all
  become: yes
  vars:
    consul_version: "1.20.1"
    nomad_version: "1.9.4"
    traefik_version: "v3.3.1"
    cni_version: "1.5.1"
    datacenter: "homelab"
    host_volumes: []
    trusted_proxy_ips: ["127.0.0.1/32"]
    # Per-agent ExecStart: the config flag differs between Consul and Nomad.
    agent_exec_start:
      consul: /usr/local/bin/consul agent -config-dir=/etc/consul.d/
      nomad: /usr/local/bin/nomad agent -config=/etc/nomad.d/
  tasks:
    - name: Install dependencies
      apt:
        name: [wget, unzip, curl, jq]
        state: present
        update_cache: yes

    - name: Install Consul
      block:
        - name: Download Consul
          get_url:
            url: "https://releases.hashicorp.com/consul/{{ consul_version }}/consul_{{ consul_version }}_linux_amd64.zip"
            dest: /tmp/consul.zip
        - name: Unzip Consul
          unarchive:
            src: /tmp/consul.zip
            dest: /usr/local/bin
            remote_src: yes
            mode: '0755'
      when: role in ['consul', 'nomad', 'traefik', 'nomad-client']

    - name: Create Consul config directory
      file:
        path: /etc/consul.d
        state: directory
      when: role in ['consul', 'nomad', 'traefik', 'nomad-client']

    # The `peering`, `connect` and `ports.grpc_tls` stanzas below are all at
    # Consul's own defaults for a server (peering on, connect on, gRPC-TLS
    # listening on 8503). They are written out anyway, because this file is the
    # acceptor side of a cluster peering link with mrow and "it works by default"
    # is not something to leave implicit in the one config that has to keep
    # working across upgrades. A future release flipping a default would break
    # peering with nothing in git to point at.
    - name: Configure Consul Server
      copy:
        dest: /etc/consul.d/consul.hcl
        content: |
          datacenter = "{{ datacenter }}"
          data_dir   = "/var/lib/consul"
          server     = true
          bootstrap_expect = 1
          ui_config { enabled = true }
          client_addr = "0.0.0.0"
          bind_addr   = "{{ ansible_default_ipv4.address }}"

          # Cluster peering with the mrow Kubernetes cluster. mrow dials, this
          # side accepts — the acceptor has to be reachable when the handshake
          # runs, and this is the always-on side.
          #
          # The token is minted by the Pulumi mrow-infra stack in talos-things
          # (consul.PeeringToken against this address) and delivered into mrow as
          # the Secret `peering-token-homelab`, which its PeeringDialer redeems.
          peering {
            enabled = true
          }

          # Peering runs over the gRPC TLS port and nothing else. client_addr
          # above is 0.0.0.0, so this listens on the LAN address as well as
          # loopback — which is required, since mrow connects to
          # {{ ansible_default_ipv4.address }}:8503 from off-subnet.
          #
          # Note the plain gRPC port (8502) stays disabled. Peering does not use
          # it and it would be unauthenticated and unencrypted on 0.0.0.0.
          ports {
            grpc_tls = 8503
          }

          # Peering builds its mTLS material from the Connect CA, so Connect has
          # to be initialised even though no service mesh runs here — nothing in
          # this datacenter has a sidecar. Enabling it costs a CA and a few
          # goroutines, and without it the peering token has no roots to carry.
          connect {
            enabled = true
          }
      when: role == 'consul'

    # The datacenter must match the server's — Consul's LAN gossip pool refuses
    # to join across datacenters, and the default would be "dc1".
    - name: Configure Consul Client
      copy:
        dest: /etc/consul.d/consul.hcl
        content: |
          datacenter = "{{ datacenter }}"
          data_dir   = "/var/lib/consul"
          retry_join = ["{{ consul_ip }}"]
          bind_addr  = "{{ ansible_default_ipv4.address }}"
      when: role in ['nomad', 'traefik', 'nomad-client']

    - name: Install Nomad
      block:
        - name: Download Nomad
          get_url:
            url: "https://releases.hashicorp.com/nomad/{{ nomad_version }}/nomad_{{ nomad_version }}_linux_amd64.zip"
            dest: /tmp/nomad.zip
        - name: Unzip Nomad
          unarchive:
            src: /tmp/nomad.zip
            dest: /usr/local/bin
            remote_src: yes
            mode: '0755'
      when: role in ['nomad', 'nomad-client']

    - name: Create Nomad config directory
      file:
        path: /etc/nomad.d
        state: directory
      when: role in ['nomad', 'nomad-client']

    # Deliberately no `datacenter` here. A job's `datacenters` list is matched
    # against the *client's* datacenter, not the server's — oracle's client sits
    # in datacenter "oracle" and places against this same server. Setting it on
    # the server changes nothing about placement, and changing it on a server
    # that already holds raft state stops the agent from coming back up.
    - name: Configure Nomad Server
      copy:
        dest: /etc/nomad.d/nomad.hcl
        content: |
          data_dir  = "/var/lib/nomad"
          bind_addr = "0.0.0.0"
          advertise {
            http = "{{ ansible_default_ipv4.address }}"
            rpc  = "{{ ansible_default_ipv4.address }}"
            serf = "{{ ansible_default_ipv4.address }}"
          }
          server {
            enabled = true
            bootstrap_expect = 1
          }
          consul {
            address = "127.0.0.1:8500"
          }
      when: role == 'nomad'

    # ── Nomad client: Docker driver + bridge networking ────────────────────────

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker
      when: role == 'nomad-client'

    - name: Enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes
      when: role == 'nomad-client'

    - name: Create CNI plugin directory
      file:
        path: /opt/cni/bin
        state: directory
      when: role == 'nomad-client'

    # Nomad's bridge network mode (used by the lookout job) is CNI-backed and
    # silently fails to place allocations without these.
    - name: Install CNI plugins
      unarchive:
        src: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/cni-plugins-linux-amd64-v{{ cni_version }}.tgz"
        dest: /opt/cni/bin
        remote_src: yes
        creates: /opt/cni/bin/bridge
      when: role == 'nomad-client'

    - name: Load br_netfilter
      copy:
        dest: /etc/modules-load.d/br_netfilter.conf
        content: "br_netfilter\n"
      when: role == 'nomad-client'

    - name: Enable bridge netfilter sysctls
      copy:
        dest: /etc/sysctl.d/99-nomad-cni.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      when: role == 'nomad-client'

    - name: Apply bridge netfilter sysctls
      shell: modprobe br_netfilter && sysctl -p /etc/sysctl.d/99-nomad-cni.conf
      changed_when: false
      when: role == 'nomad-client'

    - name: Create Nomad host volume directories
      file:
        path: "{{ item.path }}"
        state: directory
        mode: '0755'
      loop: "{{ host_volumes }}"
      when: role == 'nomad-client'

    - name: Configure Nomad Client
      copy:
        dest: /etc/nomad.d/nomad.hcl
        content: |
          datacenter = "{{ datacenter }}"
          data_dir  = "/var/lib/nomad"
          bind_addr = "0.0.0.0"
          advertise {
            http = "{{ ansible_default_ipv4.address }}"
            rpc  = "{{ ansible_default_ipv4.address }}"
            serf = "{{ ansible_default_ipv4.address }}"
          }
          client {
            enabled  = true
            cni_path = "/opt/cni/bin"

            server_join {
              retry_join = ["{{ nomad_ip }}:4647"]
            }
          {% for hv in host_volumes %}

            host_volume "{{ hv.name }}" {
              path      = "{{ hv.path }}"
              read_only = false
            }
          {% endfor %}
          }
          consul {
            address = "127.0.0.1:8500"
          }
          plugin "docker" {
            config {
              volumes {
                enabled = true
              }
            }
          }
      when: role == 'nomad-client'

    # ── Traefik ────────────────────────────────────────────────────────────────

    - name: Install Traefik
      block:
        - name: Download Traefik
          get_url:
            url: "https://github.com/traefik/traefik/releases/download/{{ traefik_version }}/traefik_{{ traefik_version }}_linux_amd64.tar.gz"
            dest: /tmp/traefik.tar.gz
        - name: Unarchive Traefik
          unarchive:
            src: /tmp/traefik.tar.gz
            dest: /usr/local/bin
            remote_src: yes
      when: role == 'traefik'

    - name: Create Traefik config directory
      file:
        path: /etc/traefik
        state: directory
      when: role == 'traefik'

    # exposedByDefault is off so a service is only routed once it opts in with
    # traefik.enable=true — otherwise Consul's own agents would get published.
    # The constraint keeps oracle-tagged services on oracle's own Traefik; both
    # share this single Consul datacenter.
    - name: Configure Traefik
      copy:
        dest: /etc/traefik/traefik.yml
        content: |
          global:
            checkNewVersion: false
            sendAnonymousUsage: false
          api:
            insecure: true
            dashboard: true
          log:
            level: INFO
          accessLog: {}
          entryPoints:
            web:
              address: ":80"
              forwardedHeaders:
                trustedIPs: {{ trusted_proxy_ips | to_json }}
            traefik:
              address: ":8080"
          providers:
            consulCatalog:
              prefix: traefik
              exposedByDefault: false
              refreshInterval: 15s
              constraints: "!Tag(`oracle`)"
              endpoint:
                address: "127.0.0.1:8500"
                scheme: http
      when: role == 'traefik'

    # ── Cloudflare tunnel ──────────────────────────────────────────────────────

    - name: Install cloudflared
      get_url:
        url: "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
        dest: /usr/local/bin/cloudflared
        mode: '0755'
      when: role == 'cloudflared'

    - name: Create cloudflared config directory
      file:
        path: /etc/cloudflared
        state: directory
        mode: '0750'
      when: role == 'cloudflared'

    # A remotely-managed tunnel takes its ingress from the Cloudflare dashboard
    # and ignores this file; a locally-managed one uses it. Writing it makes the
    # catch-all to Traefik work in both cases.
    - name: Configure cloudflared ingress
      copy:
        dest: /etc/cloudflared/config.yml
        mode: '0640'
        content: |
          originRequest:
            noTLSVerify: true
          ingress:
            - service: {{ traefik_origin }}
      when: role == 'cloudflared'

    # Left stopped: the unit needs TUNNEL_TOKEN, which Pulumi writes to
    # cloudflared.env out-of-band and only then starts the service.
    - name: Setup cloudflared systemd service
      copy:
        dest: /etc/systemd/system/cloudflared.service
        content: |
          [Unit]
          Description=Cloudflare Tunnel
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          EnvironmentFile=/etc/cloudflared/cloudflared.env
          ExecStart=/usr/local/bin/cloudflared --no-autoupdate --config /etc/cloudflared/config.yml tunnel run
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      when: role == 'cloudflared'

    - name: Reload systemd for cloudflared
      systemd:
        daemon_reload: yes
      when: role == 'cloudflared'

    # ── Services ───────────────────────────────────────────────────────────────

    # The two agents do NOT share a config flag: Consul takes -config-dir,
    # Nomad takes -config (which also accepts a directory). Templating
    # "-config-dir" for both made Nomad reject its arguments, print its usage
    # text and exit 1 after ~140ms, so the Nomad server has never actually run
    # under systemd here. oracle-setup.sh gets this right, which is why the
    # oracle client works.
    - name: Setup systemd services
      copy:
        dest: "/etc/systemd/system/{{ item }}.service"
        content: |
          [Unit]
          Description={{ item }}
          After=network-online.target
          Wants=network-online.target
          [Service]
          ExecStart={{ agent_exec_start[item] }}
          Restart=always
          RestartSec=5
          LimitNOFILE=65536
          [Install]
          WantedBy=multi-user.target
      loop: "{{ services }}"
      when: services is defined and item != 'traefik'

    - name: Setup Traefik systemd service
      copy:
        dest: "/etc/systemd/system/traefik.service"
        content: |
          [Unit]
          Description=traefik
          After=network-online.target
          Wants=network-online.target
          [Service]
          ExecStart=/usr/local/bin/traefik --configFile=/etc/traefik/traefik.yml
          Restart=always
          [Install]
          WantedBy=multi-user.target
      when: role == 'traefik'

    - name: Enable and start services
      systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
        daemon_reload: yes
      loop: "{{ services }}"
      when: services is defined

    # ── Readiness ──────────────────────────────────────────────────────────────
    # `state: restarted` returns as soon as systemd spawns the process, not when
    # the agent is serving. Pulumi's Consul and Nomad providers connect the
    # instant this play returns, so without these gates the first API call after
    # a restart races the agent and fails with "connection refused".

    - name: Verify the agents are actually serving
      block:
        - name: Wait for the Consul agent to listen
          wait_for:
            host: 127.0.0.1
            port: 8500
            timeout: 120
          when: services is defined and 'consul' in services

        # Catalog writes are rejected until a leader exists, so port-open is not
        # enough. /v1/status/leader returns a bare "" until election completes.
        #
        # The `| default(...)` guards matter: while the agent is still down, `uri`
        # returns a result with no `status` key at all, and a bare `.status` makes
        # the conditional raise, which aborts the task instead of retrying it.
        - name: Wait for a Consul leader
          uri:
            url: http://127.0.0.1:8500/v1/status/leader
            return_content: yes
          register: consul_leader
          until: (consul_leader.status | default(0)) == 200 and ((consul_leader.content | default('')) | length) > 2
          retries: 30
          delay: 2
          when: role == 'consul'

        # Peering happens over 8503 and nowhere else, so "Consul is up" is not
        # the same as "Consul can be peered with". This is the check whose
        # absence let the peering failure look like a mrow-side problem for
        # weeks: the HTTP API on 8500 answered fine the whole time.
        - name: Wait for the Consul gRPC-TLS port to listen
          wait_for:
            host: 127.0.0.1
            port: 8503
            timeout: 60
          when: role == 'consul'

        # Confirm it is bound on the LAN address too, not just loopback. A
        # `client_addr` that ends up as 127.0.0.1 produces a Consul that peers
        # perfectly from the box itself and is unreachable from mrow.
        - name: Verify 8503 is bound on the LAN address, not only loopback
          shell: |
            ss -lnt 2>/dev/null | awk '$4 ~ /:8503$/ {print $4}'
          register: grpc_bind
          changed_when: false
          failed_when: >
            grpc_bind.stdout is not search('0\.0\.0\.0:8503')
            and grpc_bind.stdout is not search('\*:8503')
            and grpc_bind.stdout is not search(ansible_default_ipv4.address + ':8503')
          when: role == 'consul'

        - name: Wait for the Nomad agent to listen
          wait_for:
            host: 127.0.0.1
            port: 4646
            timeout: 120
          when: services is defined and 'nomad' in services

        - name: Wait for a Nomad leader
          uri:
            url: http://127.0.0.1:4646/v1/status/leader
            return_content: yes
          register: nomad_leader
          until: (nomad_leader.status | default(0)) == 200 and ((nomad_leader.content | default('')) | length) > 2
          retries: 30
          delay: 2
          when: role == 'nomad'

        # Submitting a job to a datacenter with no ready client does not fail — the
        # allocation just sits queued forever. Fail loudly here instead.
        - name: Wait for this client to register with the Nomad server
          uri:
            url: "http://{{ nomad_ip }}:4646/v1/nodes"
            return_content: yes
          register: nomad_nodes
          until: >
            (nomad_nodes.status | default(0)) == 200 and
            ((nomad_nodes.json | default([]))
              | selectattr('Datacenter', 'equalto', datacenter)
              | selectattr('Status', 'equalto', 'ready')
              | list | length) > 0
          retries: 30
          delay: 5
          when: role == 'nomad-client'

        - name: Wait for Traefik to listen
          wait_for:
            host: 127.0.0.1
            port: 80
            timeout: 120
          when: role == 'traefik'

      # A bare "Timeout when waiting for 127.0.0.1:4646" says nothing about
      # why the agent died. Surface the journals in the failure itself so a
      # broken config is diagnosable from the deploy log alone.
      rescue:
        - name: Collect service journals
          shell: |
            for unit in consul nomad traefik cloudflared; do
              systemctl list-unit-files "$unit.service" --no-legend | grep -q . || continue
              echo "===== $unit ====="
              systemctl is-active "$unit" || true
              systemctl status "$unit" --no-pager -l 2>&1 | tail -25 || true
              journalctl -u "$unit" -n 40 --no-pager 2>/dev/null || true
            done
            # journald returns "-- No entries --" in these LXCs even for units
            # that are running, so the journal alone explains nothing. Run any
            # dead agent in the foreground to capture what it prints on startup.
            for agent in consul nomad; do
              [ -x "/usr/local/bin/$agent" ] || continue
              [ -d "/etc/$agent.d" ] || continue
              systemctl is-active --quiet "$agent" && continue
              echo "===== $agent foreground start ====="
              case "$agent" in
                consul) flag="-config-dir" ;;
                *)      flag="-config" ;;
              esac
              timeout 20 "/usr/local/bin/$agent" agent "$flag=/etc/$agent.d/" 2>&1 | tail -30 || true
              echo "===== $agent config ====="
              cat "/etc/$agent.d"/*.hcl 2>/dev/null || true
            done
            echo "===== disk ====="
            df -h / /var 2>/dev/null || true
          register: agent_journals
          changed_when: false
          failed_when: false

        - name: Fail with the agent journals attached
          fail:
            msg: |
              An agent did not come up on {{ inventory_hostname }} (role={{ role }}).
              {{ agent_journals.stdout | default('no journal output') }}

    # ── Return path to the mrow cluster ────────────────────────────────────────
    # The one check that would have found the Consul peering failure directly.
    #
    # This LAN is a single flat L2 carrying three /24s: this homelab on
    # 192.168.0.x, mrow's Talos nodes on 192.168.10.x, and mrow's Cilium service
    # addresses on 192.168.11-12.x. mrow's nodes use a /16, so they ARP for
    # 192.168.0.201 directly and the request arrives.
    #
    # The reply is the problem. With a /24 here, 192.168.10.11 is off-subnet, so
    # the reply goes to the default gateway — and the Eero has no route for
    # 192.168.10.0/24, so it drops it. Every port appears filtered from mrow while
    # working perfectly from any host inside 192.168.0.0/24.
    #
    # framework.LAN_PREFIX now configures /16, which makes those ranges on-link.
    # But Proxmox only writes the address into the guest at creation, so an
    # already-running container keeps its old /24 until it is restarted.
    #
    # Non-fatal on purpose: this is a real problem that does NOT mean the deploy
    # failed, and failing here would block an otherwise-good run on a condition
    # whose fix is "restart the container".
    - name: Check the netmask covers mrow's subnets
      shell: |
        set -o pipefail
        ip -4 -o addr show scope global | awk '{print $2, $4}'
      args:
        executable: /bin/bash
      register: lan_prefix_check
      changed_when: false
      failed_when: false
      when: role in ['consul', 'nomad', 'traefik', 'nomad-client']

    - name: Warn if the netmask still cannot reach mrow
      debug:
        msg: |
          ────────────────────────────────────────────────────────────────────
          NETMASK TOO NARROW on {{ inventory_hostname }} — mrow cannot be
          replied to.

          Interfaces: {{ lan_prefix_check.stdout_lines | default([]) | join(', ') }}

          A /24 here means replies to mrow's 192.168.10.x nodes are handed to
          192.168.0.1, which has no route for that subnet and drops them.
          Consul cluster peering cannot establish in this state, and neither
          can anything else mrow initiates against this host.

          Fix: framework.LAN_PREFIX already sets /16 for newly-applied config.
          Restart this guest so it re-reads its network configuration:
              qm reboot {{ vmid | default('<vmid>') }}      # VM
              pct reboot {{ vmid | default('<vmid>') }}     # LXC
          Then re-run and confirm this warning is gone.
          ────────────────────────────────────────────────────────────────────
      when:
        - role in ['consul', 'nomad', 'traefik', 'nomad-client']
        - lan_prefix_check.stdout is defined
        # /16 or wider is fine; /17..../32 is not. Matching on "/16 " is enough
        # here because nothing in this plan would legitimately use /8-/15.
        - lan_prefix_check.stdout is not search('/16')

    # Bridge-mode allocations run, but their mapped host ports refuse
    # connections, so Consul marks them critical and Traefik drops the route:
    #   dial tcp 192.168.0.230:30879: connect: connection refused
    # "Refused" rather than "timed out" means nothing DNAT'd the packet, i.e.
    # the CNI portmap rules are absent or not matching. Record the firewall
    # state so the cause is visible in the deploy log.
    - name: Record CNI port-forwarding state
      shell: |
        echo "--- iptables nat, CNI chains ---"
        iptables -t nat -S 2>&1 | grep -i cni | head -25 || echo "(no CNI rules in iptables nat)"
        echo "--- nftables, CNI/portmap ---"
        nft list ruleset 2>/dev/null | grep -iE 'cni|dnat' | head -15 || echo "(nft unavailable or no matches)"
        echo "--- docker firewall backend ---"
        docker info 2>/dev/null | grep -iE 'firewall|iptables' || echo "(not reported)"
        echo "--- listening ports ---"
        ss -lntp 2>/dev/null | head -15 || true
      register: cni_state
      changed_when: false
      failed_when: false
      when: role == 'nomad-client'

    - name: Show CNI port-forwarding state
      debug:
        msg: "{{ cni_state.stdout_lines | default([]) }}"
      when: role == 'nomad-client'
