[globals]

#tryinclude "extensions_huddle.conf"
#tryinclude "switchboard/routes.conf"

[general]
autofallthrough=yes

; Internal dialplan shared by all SCCP phones.
[sccp-internal]
include => switchboard-routes

; Speak a Slack member's name, confirm it, and join their huddle.
exten => 0,1,Goto(huddle-operator,s,1)

; Read-only handset directory entries resolve to recent Slack contacts.
; The d100 + four decimal digits prefix carries the contact reference.
exten => _88XXXX,1,Set(OPERATOR_DIRECTORY=${EXTEN:2:4})
 same => n,Goto(huddle-operator,s,1)

; Control Home Assistant devices by speaking to Assist.
exten => 555,1,Goto(home-assistant-voice,s,1)

; Speak with the local Codex voice bridge.
exten => 611,1,Set(CODEX_SESSION=000)
 same => n,Goto(codex-voice,s,1)
; 611-001 is dialed as six digits: 611001. No punctuation on the keypad.
exten => _611XXX,1,Set(CODEX_SESSION=${EXTEN:3:3})
 same => n,Goto(codex-voice,s,1)

; Any 6xxx extension dials the matching SCCP line (6738, 6739, ...).
; New phones added via add-phone.sh work with no dialplan edits.
exten => _6XXX,1,Dial(SCCP/${EXTEN},30)
 same => n,Hangup()

; Echo test - talk and hear yourself (verifies two-way audio)
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Milliwatt test tone
exten => 601,1,Answer()
 same => n,Milliwatt()

; Simple "hello world" announcement
exten => 602,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

[codex-voice]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=1800)
 ; Read a fresh UUID from the kernel, then remove its trailing newline.
 same => n,Set(CODEX_CALL_ID=${SHELL(cat /proc/sys/kernel/random/uuid)})
 same => n,Set(CODEX_CALL_ID=${CODEX_CALL_ID:0:36})
 ; UUID prefix carries the session code; the rest remains random per call.
 same => n,ExecIf($["${CODEX_SESSION}" = ""]?Set(CODEX_SESSION=000))
 same => n,Set(CODEX_CALL_ID=${CODEX_SESSION}${CODEX_CALL_ID:3})
 same => n,AudioSocket(${CODEX_CALL_ID},127.0.0.1:9096)
 same => n,Hangup()

[home-assistant-voice]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=1800)
 same => n,Set(HA_CALL_ID=${SHELL(cat /proc/sys/kernel/random/uuid)})
 same => n,Set(HA_CALL_ID=${HA_CALL_ID:0:36})
 same => n,AudioSocket(${HA_CALL_ID},127.0.0.1:9093)
 same => n,Hangup()

[huddle-operator]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=3600)
 same => n,Set(OPERATOR_CALL_ID=${SHELL(cat /proc/sys/kernel/random/uuid)})
 same => n,Set(OPERATOR_CALL_ID=${OPERATOR_CALL_ID:0:36})
 same => n,Set(OPERATOR_CALL_ID=f100${OPERATOR_CALL_ID:4})
 same => n,ExecIf($["${OPERATOR_DIRECTORY}" != ""]?Set(OPERATOR_CALL_ID=d100${OPERATOR_DIRECTORY}${OPERATOR_CALL_ID:8}))
 same => n,AudioSocket(${OPERATOR_CALL_ID},127.0.0.1:9096)
 same => n,Hangup()
