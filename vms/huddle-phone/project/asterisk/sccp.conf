; chan-sccp-b configuration - Cisco SCCP (Skinny) phones
; PBX host IP that phones register to (SCCP TCP port 2000).
[general]
servername      = LabPBX
keepalive       = 60
debug           = core
bindaddr        = 0.0.0.0
port            = 2000
disallow        = all
allow           = ulaw
allow           = alaw
allow           = g722
firstdigittimeout = 16
digittimeout    = 8
autoanswer_ring_time = 1
dnd             = reject
hotline_enabled = no
directrtp       = no
earlyrtp        = immediate
echocancel      = on
silencesuppression = off
context         = sccp-internal

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; LINES (extensions)
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[6738]
type            = line
id              = 6738
label           = 6738
description     = Phone 1 (7945G)
context         = sccp-internal
cid_num         = 6738
cid_name        = Phone 1

[6739]
type            = line
id              = 6739
label           = 6739
description     = Phone 2
context         = sccp-internal
cid_num         = 6739
cid_name        = Phone 2

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; DEVICES (one section per phone, keyed by SEP<MAC>)
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[SEP0C2724317F2E]
type            = device
description     = Cisco 7945G #1
devicetype      = 7945
button          = line, 6738

