; Stage with the AGI wrapper during PBX deployment. Not installed by default.
; Include switchboard-saved-tasks from sccp-internal.
[switchboard-saved-tasks]
exten => _89XXXX,1,Answer()
 same => n,AGI(switchboard-task,${EXTEN})
 same => n,GotoIf($["${SWITCHBOARD_TASK_EXTENSION}" = ""]?failed)
 same => n,Goto(sccp-internal,${SWITCHBOARD_TASK_EXTENSION},1)
 same => n(failed),Playback(pbx-invalid)
 same => n,Hangup()
