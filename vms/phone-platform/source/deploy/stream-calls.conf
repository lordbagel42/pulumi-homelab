; Include this file at top level from extensions.conf. Do not include this
; context in a handset's dialing context: only AMI originates into it.
[switchboard-stream]
exten => s,1,NoOp(Switchboard streaming call)
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=${SWITCHBOARD_MAX_SECONDS})
 same => n,AudioSocket(${SWITCHBOARD_CALL_ID},127.0.0.1:${SWITCHBOARD_AUDIO_PORT})
 same => n,Hangup()
