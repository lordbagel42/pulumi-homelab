; Only this small route context belongs in the handset's include tree.
[switchboard-incoming-route]
exten => 333,1,Goto(switchboard-incoming,s,1)

[switchboard-incoming]
exten => s,1,Set(SWITCHBOARD_ACCEPTED=0)
 same => n,Set(SWITCHBOARD_CALL_ID=)
 same => n,Set(SWITCHBOARD_AUDIO_PORT=)
 same => n,Set(SWITCHBOARD_MAX_SECONDS=)
 ; Independent watchdog if the API process hangs while waiting for June.
 same => n,Set(TIMEOUT(absolute)=40)
 same => n,Set(AGISIGHUP=yes)
 same => n,Set(AGIEXITONHANGUP=yes)
 same => n,Ringing()
 same => n,AGI(agi://127.0.0.1:4573/june)
 ; A normally closed AGI socket alone is NOT proof of acceptance.
 same => n,GotoIf($["${AGISTATUS}" != "SUCCESS"]?reject)
 same => n,GotoIf($["${SWITCHBOARD_ACCEPTED}" != "1"]?reject)
 same => n,GotoIf($["${SWITCHBOARD_CALL_ID}" = "" | "${SWITCHBOARD_AUDIO_PORT}" = "" | "${SWITCHBOARD_MAX_SECONDS}" = ""]?reject)
 same => n,Goto(switchboard-stream,s,1)
 same => n(reject),Hangup()
