name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bambu_api_only:
        description: Build the pinned Bambu API image and update only its Pulumi job
        type: boolean
        default: false

concurrency:
  group: deploy-infra

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: find lxcs vms -name "*.sh" -print0 | xargs -0 shellcheck --severity=warning

  deploy:
    name: Deploy
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
        run: |
          if [ -z "$NB_SETUP_KEY" ]; then
            echo "::error::NB_SETUP_KEY secret is not set — add it under Settings → Secrets → Actions"
            exit 1
          fi
          sudo netbird up --setup-key "$NB_SETUP_KEY"

      - name: Wait for Netbird peer connection
        run: |
          connected=false
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then
              echo "Netbird connected"
              connected=true
              break
            fi
            echo "Waiting for Netbird... ($i/30)"
            sleep 2
          done
          if [ "$connected" != "true" ]; then
            echo "::error::Netbird failed to connect after 60 seconds — check NB_SETUP_KEY and peer status"
            exit 1
          fi

      - name: Install provisioning tools
        run: sudo apt-get update -qq && sudo apt-get install -y ansible-core jq

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
        with:
          pulumi-version: 3.273.0

      - name: Fetch pinned artifacts binary
        run: bash lxcs/artifacts/fetch-bundle.sh
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Build and load pinned Bambu API image
        if: inputs.bambu_api_only
        run: bash nomad/bambu-api/load-image.sh
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy and verify only the Bambu API job
        if: inputs.bambu_api_only
        shell: bash
        run: |
          set -euo pipefail
          target='urn:pulumi:homelab::pulumi-homelab::nomad:index/job:Job::bambu-api'
          plan=$(mktemp)
          events=$(mktemp)
          trap 'rm -f "$plan" "$events"' EXIT
          pulumi preview --stack homelab --target "$target" --refresh --save-plan "$plan" --json > "$events"
          # Log only operation identities, never resource inputs or secret values.
          jq -s '{summaries: [.[] | .summaryEvent? | select(. != null)],
            operations: [.[] | .resourcePreEvent.metadata? | select(. != null)
              | select(.op != "same" and .op != "read" and .op != "refresh")
              | {urn, op}]}' "$events"
          jq -s -e --arg target "$target" '
            ([.[] | .summaryEvent? | select(. != null)] | length == 1) and
            ([.[] | .resourcePreEvent.metadata? | select(.urn == $target)
              | select(.op == "same" or .op == "update")] | length > 0) and
            ([.[] | .resourcePreEvent.metadata? | select(. != null)
              | select(.op != "same" and .op != "read" and .op != "refresh")
              | select(.urn != $target or .op != "update")] | length == 0)
          ' "$events"
          jq -s '[.[] | .summaryEvent? | select(. != null) | .resourceChanges]' "$events"
          pulumi up --stack homelab --target "$target" --plan "$plan" --yes --skip-preview
          pulumi preview --stack homelab --target "$target" --refresh --expect-no-changes
          curl --fail --silent --show-error https://bambuapi.raygen.dev/v1/healthz
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOSTED: "true"
          PULUMI_EXPERIMENTAL: "true"
          PULUMI_ENABLE_STREAMING_JSON_PREVIEW: "true"

      - uses: pulumi/actions@v6
        if: ${{ !inputs.bambu_api_only }}
        with:
          command: up
          stack-name: homelab
          # Reconcile state against reality before updating. Consul service
          # registrations in particular get lost out of band (an agent restart
          # dropped the authentik service while Pulumi still believed it
          # existed, so it was never re-registered and its route 404'd). Without
          # this, that class of drift is invisible and self-perpetuating.
          refresh: true
          comment-on-summary: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # pulumi-proxmoxve is not on the Pulumi registry — it is pulled from
          # GitHub releases, which rate-limits unauthenticated runners to 60
          # requests/hour and then fails the update with a 403. Authenticating
          # the plugin download raises that to 1000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOSTED: "true"

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
