name: Recover hashistack containers (one-shot)

# consul-server (201), nomad-server (202) and traefik (203) were destroyed by
# update 167: adding `dns` to initialization made them replacements, and the
# delete-original step ran against the already-recreated vmId.
#
# The normal Deploy workflow runs with refresh: false, so Pulumi may still hold
# stale state claiming those containers exist and would skip recreating them —
# then provision against hosts that are not there. So refresh first, then up.
#
# Safe to run now that ProxmoxMachine sets ignoreChanges on initialization:
# dokploy (211) and authentik (220) are running and must NOT be replaced.
#
# Delete once the stack is healthy.

on:
  push:
    branches:
      - claude/failed-deployment-recovery-fa5moq
  workflow_dispatch:

concurrency:
  group: deploy-infra

jobs:
  recover:
    name: Refresh then up
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
        run: sudo netbird up --setup-key "$NB_SETUP_KEY"

      - name: Wait for Netbird peer connection
        run: |
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then echo connected; exit 0; fi
            sleep 2
          done
          echo "::error::Netbird failed to connect"; exit 1

      # Reconcile state with reality: marks 201/202/203 as gone so `up` recreates
      # them. Does not change any live resource.
      #
      # Expected to exit non-zero right now: refreshing the nomad:index:Job
      # resources queries 192.168.0.202:4646, which is "no route to host" while
      # the nomad-server container is missing. The container/command resources
      # still refresh correctly (first attempt reported "- 16 deleted,
      # 61 unchanged, 8 errored"), and those 8 are exactly the nomad jobs that
      # `up` is about to recreate anyway — so don't let it block the up.
      - name: Pulumi refresh
        continue-on-error: true
        uses: pulumi/actions@v6
        with:
          command: refresh
          stack-name: homelab
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          HOSTED: "true"

      # The plain `up` recreated 201/202/203 in ~51s but left them bare: the
      # provisioning resources are command.local.Command, and rebuilding a
      # container does not invalidate them, so Pulumi still considered
      # consul/nomad/traefik provisioned. Force those three to re-run.
      #
      # Everything else still gets a normal up, so the nomad jobs are recreated
      # once nomad-server is actually serving again.
      - name: Pulumi up (replacing hashistack provisioners)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          HOSTED: "true"
        run: |
          set -uo pipefail
          base='urn:pulumi:homelab::pulumi-homelab::command:local/command:Command'
          pulumi up --yes --stack homelab --non-interactive \
            --replace "$base::consul-provision" \
            --replace "$base::nomad-provision" \
            --replace "$base::traefik-provision"

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
