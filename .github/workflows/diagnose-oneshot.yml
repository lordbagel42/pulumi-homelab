name: Diagnose Homelab (one-shot)

# Temporary repair + diagnostic workflow. Runs on push to the recovery branch.
#
# Findings so far:
#   * every LXC has /etc/resolv.conf = 127.0.2.2/127.0.2.3 (the Proxmox host's
#     NetBird loopback resolvers, copied in by PVE because the container config
#     carries no `nameserver`). Routing works, DNS does not, so `apt-get update`
#     fails and the hashistack/dokploy/authentik playbooks die on task 1.
#   * nomad.service on CT 202 is failed (exit 1 after 306ms) and the container
#     has no persistent journal, so the real reason is still unknown.
#
# This run sets `nameserver` on the container configs (in-place, no rebuild),
# repairs resolv.conf on the running guests so the fix applies immediately, and
# then captures nomad's actual startup output.
#
# Delete once the deploy is healthy again.

on:
  push:
    branches:
      - claude/failed-deployment-recovery-fa5moq
  workflow_dispatch:

env:
  DNS_SERVERS: 1.1.1.1 8.8.8.8

jobs:
  repair:
    name: Repair DNS and diagnose nomad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
        run: |
          if [ -z "$NB_SETUP_KEY" ]; then
            echo "::error::NB_SETUP_KEY secret is not set"
            exit 1
          fi
          sudo netbird up --setup-key "$NB_SETUP_KEY"

      - name: Wait for Netbird peer connection
        run: |
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then
              echo "Netbird connected"
              exit 0
            fi
            echo "Waiting for Netbird... ($i/30)"
            sleep 2
          done
          echo "::error::Netbird failed to connect"
          exit 1

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Resolve stack config
        id: cfg
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          get() { pulumi config get "$1" --stack homelab 2>/dev/null || true; }

          ENDPOINT="$(get PROXMOX_NETBIRD_ENDPOINT)"
          PVE_USER="$(get PROXMOX_USERNAME)"
          PVE_PASS="$(get PROXMOX_PASSWORD)"
          get SSH_PRIVATE_KEY > /tmp/id_pve
          chmod 600 /tmp/id_pve

          HOST="$(printf '%s' "$ENDPOINT" | sed -E 's#^https?://##; s#/.*$##')"
          echo "::add-mask::$HOST"
          echo "::add-mask::${HOST%%:*}"
          echo "::add-mask::$PVE_PASS"
          [ -n "$PVE_USER" ] && echo "::add-mask::$PVE_USER"

          {
            echo "api=https://${HOST%%:*}:8006"
            echo "pve_user=$PVE_USER"
          } >> "$GITHUB_OUTPUT"
          echo "PVE_PASS=$PVE_PASS" >> "$GITHUB_ENV"

      - name: Show node DNS config, then set nameserver on each container
        if: always()
        env:
          PVE_API: ${{ steps.cfg.outputs.api }}
          PVE_USER: ${{ steps.cfg.outputs.pve_user }}
        run: |
          set -uo pipefail
          TICKET_JSON=$(curl -sk --max-time 20 -d "username=$PVE_USER" --data-urlencode "password=$PVE_PASS" \
            "$PVE_API/api2/json/access/ticket")
          TICKET=$(printf '%s' "$TICKET_JSON" | jq -r '.data.ticket // empty')
          CSRF=$(printf '%s' "$TICKET_JSON" | jq -r '.data.CSRFPreventionToken // empty')
          if [ -z "$TICKET" ]; then
            echo "::error::Proxmox API login failed"
            exit 1
          fi
          echo "::add-mask::$TICKET"
          echo "::add-mask::$CSRF"
          api()  { curl -sk --max-time 25 -H "Cookie: PVEAuthCookie=$TICKET" "$PVE_API/api2/json$1"; }
          apiw() { curl -sk --max-time 40 -X PUT -H "Cookie: PVEAuthCookie=$TICKET" \
                     -H "CSRFPreventionToken: $CSRF" "$PVE_API/api2/json$1" "${@:2}"; }

          echo "===== per-node DNS (this is what containers inherit) ====="
          for node in $(api /nodes | jq -r '.data[].node'); do
            echo -n "$node: "
            api "/nodes/$node/dns" | jq -c '.data'
          done

          echo
          echo "===== setting nameserver on containers ====="
          for id in 201 202 203 204 211 220; do
            node=$(api "/cluster/resources?type=vm" | jq -r ".data[] | select(.vmid==$id) | .node" | head -1)
            if [ -z "$node" ]; then echo "CT $id: not found, skipping"; continue; fi
            before=$(api "/nodes/$node/lxc/$id/config" | jq -r '.data.nameserver // "(unset)"')
            resp=$(apiw "/nodes/$node/lxc/$id/config" --data-urlencode "nameserver=$DNS_SERVERS")
            after=$(api "/nodes/$node/lxc/$id/config" | jq -r '.data.nameserver // "(unset)"')
            echo "CT $id on $node: '$before' -> '$after'  ${resp:+api=$resp}"
          done

      - name: Repair resolv.conf on running guests
        if: always()
        run: |
          set -uo pipefail
          for id in 201 202 203 211 220; do
            ip="192.168.0.$id"
            echo "===== CT $id @ $ip ====="
            timeout 60 ssh -i /tmp/id_pve -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
              -o BatchMode=yes "root@$ip" "bash -s" <<EOSH || echo "!!! ssh to $ip failed"
          set -u
          printf '# --- BEGIN PVE ---\nsearch local\n' > /etc/resolv.conf
          for s in $DNS_SERVERS; do echo "nameserver \$s" >> /etc/resolv.conf; done
          printf '# --- END PVE ---\n' >> /etc/resolv.conf
          cat /etc/resolv.conf
          getent hosts deb.debian.org && echo "DNS OK" || echo "DNS STILL BROKEN"
          apt-get update 2>&1 | tail -6
          EOSH
          done

      - name: Diagnose nomad on CT 202
        if: always()
        run: |
          set -uo pipefail
          timeout 150 ssh -i /tmp/id_pve -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
            -o BatchMode=yes root@192.168.0.202 'bash -s' <<'EOSH' || echo "!!! ssh failed"
          set -u
          echo "===== /etc/nomad.d ====="
          ls -la /etc/nomad.d/; echo; cat /etc/nomad.d/*.hcl
          echo "===== unit file ====="
          cat /etc/systemd/system/nomad.service
          echo "===== data_dir ====="
          ls -la /var/lib/ | grep -i nomad || echo "/var/lib/nomad MISSING"
          echo "===== nomad version ====="
          /usr/local/bin/nomad version
          echo "===== foreground start attempt (10s) ====="
          timeout 10 /usr/local/bin/nomad agent -config-dir=/etc/nomad.d/ 2>&1 | head -40
          echo "(exit: $?)"
          echo "===== systemctl restart + status ====="
          systemctl reset-failed nomad 2>/dev/null || true
          systemctl restart nomad 2>&1 || true
          sleep 5
          systemctl status nomad --no-pager 2>&1 | head -20
          echo "===== listening ports ====="
          (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | head -20
          EOSH

      - name: Service endpoint probes
        if: always()
        run: |
          set -x
          curl -sS --max-time 10 http://192.168.0.201:8500/v1/status/leader || echo "consul unreachable"
          echo
          curl -sS --max-time 10 http://192.168.0.202:4646/v1/status/leader || echo "nomad unreachable"

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
