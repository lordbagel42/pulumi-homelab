name: Diagnose Homelab (one-shot)

# Temporary repair + diagnostic workflow. Runs on push to the recovery branch.
#
# Findings so far:
#   * every LXC had /etc/resolv.conf = 127.0.2.2/127.0.2.3 (the Proxmox host's
#     NetBird loopback resolvers, copied in by PVE because the container config
#     carried no `nameserver`). Routing works, DNS does not, so `apt-get update`
#     fails and the hashistack/dokploy/authentik playbooks die on task 1.
#     Run 3 already set `nameserver` on the CT configs via the Proxmox API.
#   * nomad.service on CT 202 is failed (exit 1 after 306ms) and the container
#     has no persistent journal, so the real reason is still unknown.
#
# Every remote step is hard-bounded: run 3 wedged in an unbounded ssh loop.
#
# Delete once the deploy is healthy again.

on:
  push:
    branches:
      - claude/failed-deployment-recovery-fa5moq
  workflow_dispatch:

concurrency:
  group: homelab-diagnose
  cancel-in-progress: true

jobs:
  repair:
    name: Repair DNS and diagnose nomad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
        run: |
          if [ -z "$NB_SETUP_KEY" ]; then
            echo "::error::NB_SETUP_KEY secret is not set"
            exit 1
          fi
          sudo netbird up --setup-key "$NB_SETUP_KEY"

      - name: Wait for Netbird peer connection
        run: |
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then
              echo "Netbird connected"
              exit 0
            fi
            echo "Waiting for Netbird... ($i/30)"
            sleep 2
          done
          echo "::error::Netbird failed to connect"
          exit 1

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Resolve stack config
        id: cfg
        timeout-minutes: 3
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          get() { pulumi config get "$1" --stack homelab 2>/dev/null || true; }

          ENDPOINT="$(get PROXMOX_NETBIRD_ENDPOINT)"
          PVE_USER="$(get PROXMOX_USERNAME)"
          PVE_PASS="$(get PROXMOX_PASSWORD)"
          get SSH_PRIVATE_KEY > /tmp/id_pve
          chmod 600 /tmp/id_pve

          HOST="$(printf '%s' "$ENDPOINT" | sed -E 's#^https?://##; s#/.*$##')"
          echo "::add-mask::$HOST"
          echo "::add-mask::${HOST%%:*}"
          echo "::add-mask::$PVE_PASS"
          [ -n "$PVE_USER" ] && echo "::add-mask::$PVE_USER"

          {
            echo "api=https://${HOST%%:*}:8006"
            echo "pve_user=$PVE_USER"
          } >> "$GITHUB_OUTPUT"
          echo "PVE_PASS=$PVE_PASS" >> "$GITHUB_ENV"

      - name: Confirm nameserver is set on each container config
        if: always()
        timeout-minutes: 4
        env:
          PVE_API: ${{ steps.cfg.outputs.api }}
          PVE_USER: ${{ steps.cfg.outputs.pve_user }}
        run: |
          set -uo pipefail
          TICKET_JSON=$(curl -sk --max-time 20 -d "username=$PVE_USER" --data-urlencode "password=$PVE_PASS" \
            "$PVE_API/api2/json/access/ticket")
          TICKET=$(printf '%s' "$TICKET_JSON" | jq -r '.data.ticket // empty')
          CSRF=$(printf '%s' "$TICKET_JSON" | jq -r '.data.CSRFPreventionToken // empty')
          if [ -z "$TICKET" ]; then echo "::error::Proxmox API login failed"; exit 1; fi
          echo "::add-mask::$TICKET"
          echo "::add-mask::$CSRF"
          api()  { curl -sk --max-time 25 -H "Cookie: PVEAuthCookie=$TICKET" "$PVE_API/api2/json$1"; }
          apiw() { curl -sk --max-time 40 -X PUT -H "Cookie: PVEAuthCookie=$TICKET" \
                     -H "CSRFPreventionToken: $CSRF" "$PVE_API/api2/json$1" "${@:2}"; }

          echo "===== per-node DNS (what containers would inherit) ====="
          for node in $(api /nodes | jq -r '.data[].node'); do
            printf '%s: ' "$node"; api "/nodes/$node/dns" | jq -c '.data'
          done

          echo
          for id in 201 202 203 204 211 220; do
            node=$(api "/cluster/resources?type=vm" | jq -r ".data[] | select(.vmid==$id) | .node" | head -1)
            if [ -z "$node" ]; then echo "CT $id: not found"; continue; fi
            cur=$(api "/nodes/$node/lxc/$id/config" | jq -r '.data.nameserver // "(unset)"')
            if [ "$cur" = "(unset)" ]; then
              apiw "/nodes/$node/lxc/$id/config" --data-urlencode "nameserver=1.1.1.1 8.8.8.8" >/dev/null
              cur=$(api "/nodes/$node/lxc/$id/config" | jq -r '.data.nameserver // "(unset)"')
              echo "CT $id on $node: set -> '$cur'"
            else
              echo "CT $id on $node: already '$cur'"
            fi
          done

      - name: Repair resolv.conf on running guests
        if: always()
        timeout-minutes: 4
        run: |
          set -uo pipefail

          # Written to a file rather than an inline heredoc: run 3 hung with the
          # heredoc form and produced no output to localise it.
          cat > /tmp/fix-dns.sh <<'FIXDNS'
          set -u
          printf '# --- BEGIN PVE ---\nsearch local\nnameserver 1.1.1.1\nnameserver 8.8.8.8\n# --- END PVE ---\n' > /etc/resolv.conf
          cat /etc/resolv.conf
          if getent hosts deb.debian.org; then echo "DNS OK"; else echo "DNS STILL BROKEN"; fi
          FIXDNS

          for id in 201 202 203 211 220; do
            ip="192.168.0.$id"
            echo "===== CT $id @ $ip ====="
            timeout -k 5 40 ssh -i /tmp/id_pve \
              -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o BatchMode=yes \
              -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
              "root@$ip" 'bash -s' < /tmp/fix-dns.sh
            echo "  (rc=$?)"
          done

      - name: Diagnose nomad on CT 202
        if: always()
        timeout-minutes: 5
        run: |
          set -uo pipefail

          cat > /tmp/nomad-diag.sh <<'NOMADDIAG'
          set -u
          echo "===== /etc/nomad.d ====="
          ls -la /etc/nomad.d/ 2>&1; echo; cat /etc/nomad.d/*.hcl 2>&1
          echo "===== unit file ====="
          cat /etc/systemd/system/nomad.service 2>&1
          echo "===== data_dir ====="
          ls -la /var/lib/nomad 2>&1 | head -5 || echo "/var/lib/nomad MISSING"
          echo "===== nomad version ====="
          /usr/local/bin/nomad version 2>&1
          echo "===== foreground start attempt ====="
          timeout -k 2 12 /usr/local/bin/nomad agent -config-dir=/etc/nomad.d/ 2>&1 | head -40
          echo "===== restart via systemd ====="
          systemctl reset-failed nomad 2>/dev/null || true
          timeout -k 2 20 systemctl restart nomad 2>&1 || echo "(restart returned $?)"
          sleep 3
          systemctl is-active nomad 2>&1
          systemctl status nomad --no-pager 2>&1 | head -18
          echo "===== listening ports ====="
          (ss -tln 2>/dev/null || netstat -tln 2>/dev/null) | head -15
          NOMADDIAG

          timeout -k 5 120 ssh -i /tmp/id_pve \
            -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o BatchMode=yes \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            root@192.168.0.202 'bash -s' < /tmp/nomad-diag.sh
          echo "  (rc=$?)"

      - name: Service endpoint probes
        if: always()
        timeout-minutes: 2
        run: |
          set -x
          curl -sS --max-time 10 http://192.168.0.201:8500/v1/status/leader || echo "consul unreachable"
          echo
          curl -sS --max-time 10 http://192.168.0.202:4646/v1/status/leader || echo "nomad unreachable"

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
