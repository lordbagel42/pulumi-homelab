name: Restore public routing (one-shot)

# Applies the routing fixes and verifies them end to end.
#
# What the three diagnostic rounds established:
#   * the tunnel is fine — traefik returns the same codes for the same Host
#     headers that the public hostnames do, so every remaining 404 is traefik's
#   * authentik was absent from the consul catalog entirely, because the catalog
#     API registration was made against node `authentik`, which runs its own
#     consul agent; an agent is the authority for its own node and anti-entropy
#     deletes catalog entries it does not know about. Pulumi state recorded the
#     registration as present the whole time.
#   * consul/nomad had no FQDN routers at all, only traefik's defaultRule applied
#     to the agents' own self-registrations
#   * demo had the right Host rule but was disabled: it references
#     authentik@consulcatalog, a middleware nothing defined
#   * demo and hello-world are not registered in nomad — demo was submitted by a
#     create-only local Command, hello-world by nothing at all
#   * lookout is registered with correct tags but its task never started
#     (check critical, dial tcp 192.168.0.230:24382 refused), so traefik drops it
#
# The lookout step is diagnostic only — its cause is still open.

on:
  push:
    branches:
      - claude/failed-deployment-recovery-fa5moq
  workflow_dispatch:

concurrency:
  group: deploy-infra

jobs:
  restore:
    name: Apply routing fixes and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
        run: sudo netbird up --setup-key "$NB_SETUP_KEY"

      - name: Wait for Netbird peer connection
        run: |
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then echo connected; exit 0; fi
            sleep 2
          done
          echo "::error::Netbird failed to connect"; exit 1

      # Pulumi state still claims the consul registrations and the demo job exist,
      # so without a refresh up would see nothing to do for them.
      - name: Pulumi refresh
        continue-on-error: true
        uses: pulumi/actions@v6
        with:
          command: refresh
          stack-name: homelab
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          HOSTED: "true"

      - name: Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: homelab
          comment-on-summary: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          HOSTED: "true"

      - name: Traefik routers after
        if: always()
        run: |
          set -uo pipefail
          echo "===== routers ====="
          curl -sS --max-time 20 http://192.168.0.203:8080/api/http/routers \
            | jq -r '.[]? | "\(.name)\tstatus=\(.status)\trule=\(.rule)"' || true
          echo
          echo "===== middlewares ====="
          curl -sS --max-time 20 http://192.168.0.203:8080/api/http/middlewares \
            | jq -r '.[]? | "\(.name)\tstatus=\(.status)"' || true
          echo
          echo "===== nomad jobs ====="
          curl -sS --max-time 20 http://192.168.0.202:4646/v1/jobs \
            | jq -r '.[]? | "\(.ID)\tdc=\(.Datacenters|join(","))\tstatus=\(.Status)"' || true

      # Same Host-header probe used to attribute the original 404, so the two
      # runs are directly comparable.
      - name: Verify via traefik directly, then publicly
        if: always()
        run: |
          set -uo pipefail
          hosts="auth.bagelindustries.com consul.bagelindustries.com
                 nomad.bagelindustries.com demo.bagelindustries.com
                 dokploy.raygen.dev hellonomad.raygen.dev lookout.raygen.dev"
          echo "===== traefik direct ====="
          for h in $hosts; do
            code=$(curl -sS -o /dev/null -m 12 -w '%{http_code}' \
                     -H "Host: $h" "http://192.168.0.203/" 2>/dev/null || echo 000)
            printf '%-34s HTTP %s\n' "$h" "$code"
          done
          echo
          echo "===== public (through the tunnel) ====="
          rc=0
          for h in $hosts; do
            code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "https://$h/" 2>/dev/null || echo 000)
            printf '%-34s HTTP %s\n' "$h" "$code"
            case "$code" in 404|530|000) rc=1 ;; esac
          done
          [ "$rc" -ne 0 ] && echo "::warning::at least one hostname is still not routing"
          exit 0

      # lookout's alloc is pending with no task states at all, which is the client
      # never starting it rather than a placement failure. Ask the client.
      - name: Diagnose the stuck lookout alloc
        if: always()
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          pulumi config get SSH_PRIVATE_KEY --stack homelab > /tmp/id_pve 2>/dev/null || true
          chmod 600 /tmp/id_pve
          if [ ! -s /tmp/id_pve ]; then echo "(no ssh key available)"; exit 0; fi
          timeout -k 5 90 ssh -i /tmp/id_pve -o StrictHostKeyChecking=no \
            -o ConnectTimeout=8 -o BatchMode=yes root@192.168.0.230 '
              echo "--- nomad + docker state ---"
              systemctl is-active nomad docker 2>&1
              echo "--- host volumes configured ---"
              grep -A3 host_volume /etc/nomad.d/nomad.hcl 2>/dev/null | head -20
              echo "--- disk ---"
              df -h / | tail -1
              echo "--- nomad client log ---"
              journalctl -u nomad --no-pager -n 40 | tail -40
            ' 2>&1 || echo "(ssh to 192.168.0.230 failed)"

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
