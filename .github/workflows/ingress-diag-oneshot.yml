name: Ingress attribution diagnostic (one-shot)

# Round 1: the 404 is traefik's, not cloudflared's — traefik on .203 returns the
# same codes for the same Host headers as the public hostnames do. Tunnel fine.
#
# Round 2: lookout IS in the consul catalog with correct traefik tags, yet has no
# router — and its nomad alloc is client=pending with empty TaskStates, so its
# health check cannot be passing and traefik's consulCatalog provider drops
# non-passing services. Also: probing .203:8500 from the runner was an invalid
# test. The playbook sets client_addr = "0.0.0.0" only for the consul SERVER, so
# client agents keep consul's 127.0.0.1 default. Traefik reaches it over
# loopback; the server lists traefik/.203 as alive. Nothing wrong there.
#
# Round 3 closes the remaining gaps, from inside .203 where traefik actually
# reads, plus the reason lookout will not start:
#   * is authentik in the catalog at all, and with what tags (IaC registers it
#     via reverseProxy — it is the only service in the repo that does)
#   * what traefik's own agent sees vs the server
#   * which checks are failing, and why the lookout alloc is stuck pending
#   * the datacenter mismatch: the nomad server reports dc1 while every homelab
#     jobspec asks for datacenters = ["homelab"]
#
# Read-only. No pulumi up. Delete once the fix lands.

on:
  push:
    branches:
      - claude/failed-deployment-recovery-fa5moq
  workflow_dispatch:

concurrency:
  group: deploy-infra

jobs:
  diag:
    name: Close the remaining ingress unknowns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
        run: sudo netbird up --setup-key "$NB_SETUP_KEY"

      - name: Wait for Netbird peer connection
        run: |
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then echo connected; exit 0; fi
            sleep 2
          done
          echo "::error::Netbird failed to connect"; exit 1

      - name: Catalog as the server sees it
        run: |
          set -uo pipefail
          C=http://192.168.0.201:8500
          echo "--- service names ---"
          curl -sS --max-time 30 "$C/v1/catalog/services" | jq -r 'keys | join(", ")' || echo "(failed)"
          echo
          echo "--- authentik registration ---"
          curl -sS --max-time 25 "$C/v1/catalog/service/authentik" \
            | jq -r '.[]? | "node=\(.Node) addr=\(.ServiceAddress // .Address):\(.ServicePort)\ntags=\(.ServiceTags|join("\n     "))"' \
            || echo "(failed)"
          echo
          echo "--- all non-passing checks ---"
          curl -sS --max-time 25 "$C/v1/health/state/any" \
            | jq -r '.[]? | select(.Status != "passing") | "\(.Node)/\(.ServiceName // "-")\t\(.CheckID)\t\(.Status)\t\(.Output[0:100])"' \
            || echo "(failed)"

      # Traefik decides from its own loopback agent, so read that agent, not the
      # server, and read it from inside the container.
      - name: Catalog as traefik's own agent sees it
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          pulumi config get SSH_PRIVATE_KEY --stack homelab > /tmp/id_pve 2>/dev/null || true
          chmod 600 /tmp/id_pve
          if [ ! -s /tmp/id_pve ]; then echo "(no ssh key available)"; exit 0; fi
          timeout -k 5 60 ssh -i /tmp/id_pve -o StrictHostKeyChecking=no \
            -o ConnectTimeout=8 -o BatchMode=yes root@192.168.0.203 '
              echo "--- consul agent state ---"
              systemctl is-active consul
              echo "--- services known locally ---"
              curl -s --max-time 10 http://127.0.0.1:8500/v1/catalog/services | jq -r "keys | join(\", \")"
              echo "--- authentik health as traefik sees it ---"
              curl -s --max-time 10 "http://127.0.0.1:8500/v1/health/service/authentik" \
                | jq -r ".[]? | \"checks=\(.Checks|map(.Status)|join(\",\"))\ttags=\(.Service.Tags|join(\" \"))\""
              echo "--- lookout health as traefik sees it ---"
              curl -s --max-time 10 "http://127.0.0.1:8500/v1/health/service/lookout" \
                | jq -r ".[]? | \"checks=\(.Checks|map(.Status + \":\" + (.Output//\"\")[0:60])|join(\" | \"))\""
              echo "--- traefik log tail ---"
              journalctl -u traefik --no-pager -n 25 | tail -25
            ' 2>&1 || echo "(ssh to 192.168.0.203 failed)"

      - name: Why is the lookout alloc pending
        run: |
          set -uo pipefail
          N=http://192.168.0.202:4646
          echo "--- nodes with datacenter ---"
          curl -sS --max-time 20 "$N/v1/nodes" \
            | jq -r '.[]? | "\(.Name)\tdc=\(.Datacenter)\tclass=\(.NodeClass)\tstatus=\(.Status)"' || echo "(failed)"
          echo
          echo "--- lookout evaluations (placement failures) ---"
          curl -sS --max-time 20 "$N/v1/job/lookout/evaluations" \
            | jq -r '.[]? | "eval=\(.ID[0:8]) status=\(.Status) trigger=\(.TriggeredBy) blocked=\(.BlockedEval // "-")\nfailures=\(.FailedTGAllocs // {} | tojson)"' \
            || echo "(failed)"
          echo
          echo "--- lookout alloc detail ---"
          alloc=$(curl -sS --max-time 20 "$N/v1/job/lookout/allocations" | jq -r '.[0].ID // empty')
          if [ -n "$alloc" ]; then
            curl -sS --max-time 20 "$N/v1/allocation/$alloc" \
              | jq -r '"client=\(.ClientStatus) desc=\(.ClientDescription // "-")",
                        (.TaskStates // {} | to_entries[]? |
                          "task=\(.key) state=\(.value.State) failed=\(.value.Failed)",
                          (.value.Events // [] | .[-4:][]? | "   event: \(.Type) \(.DisplayMessage // "")"))' \
              || echo "(failed)"
          else
            echo "(no allocations)"
          fi

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
