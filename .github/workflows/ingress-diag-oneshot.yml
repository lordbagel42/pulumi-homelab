name: Ingress attribution diagnostic (one-shot)

# Round 1 attributed the public 404 to traefik, not cloudflared: traefik on .203
# returns the same codes for the same Host headers that the public hostnames do
# (404 for auth/consul/nomad/demo/hellonomad/lookout, 307 for dokploy). So the
# tunnel and its Cloudflare-side ingress rules are fine and the gap is the
# consul catalog traefik routes from.
#
# Round 1's router table showed the shape of the gap:
#   consul/nomad       routed as Host(`consul`) / Host(`nomad`) — traefik's
#                      defaultRule, i.e. self-registered agents with no
#                      traefik.* tags, so no FQDN router exists at all
#   demo               correct rule but status=disabled
#   dokploy            correct and working
#   auth/lookout/      no router whatsoever
#   hellonomad
#
# Round 2 collects the catalog state behind that. Traefik reads its OWN local
# consul agent on .203:8500, so query both that and the server on .201 — and
# .201's /v1/catalog/services timed out at 15s in round 1 while
# /v1/catalog/nodes answered instantly, which needs explaining on its own.
#
# Read-only. No pulumi up. Delete once the cause is known.

on:
  push:
    branches:
      - claude/failed-deployment-recovery-fa5moq
  workflow_dispatch:

concurrency:
  group: deploy-infra

jobs:
  diag:
    name: Why is the consul catalog missing traefik routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
        run: sudo netbird up --setup-key "$NB_SETUP_KEY"

      - name: Wait for Netbird peer connection
        run: |
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then echo connected; exit 0; fi
            sleep 2
          done
          echo "::error::Netbird failed to connect"; exit 1

      # Traefik's view is the one that decides routing, so compare it against
      # the server's rather than trusting either alone.
      - name: Consul catalog from both agents
        run: |
          set -uo pipefail
          for agent in 192.168.0.201 192.168.0.203; do
            echo "########## consul agent $agent ##########"
            echo "--- status/leader ---"
            curl -sS --max-time 25 "http://$agent:8500/v1/status/leader" || echo "(failed)"
            echo
            echo "--- catalog/services ---"
            curl -sS --max-time 40 "http://$agent:8500/v1/catalog/services" | jq -S . || echo "(failed)"
            echo "--- agent/members ---"
            curl -sS --max-time 25 "http://$agent:8500/v1/agent/members" \
              | jq -r '.[]? | "\(.Name)\t\(.Addr)\tstatus=\(.Status)"' || echo "(failed)"
            echo
          done

      - name: Per-service catalog detail
        run: |
          set -uo pipefail
          for svc in authentik dokploy demo lookout hello-world consul nomad traefik; do
            echo "########## $svc ##########"
            curl -sS --max-time 25 "http://192.168.0.203:8500/v1/catalog/service/$svc" \
              | jq -r '.[]? | "node=\(.Node)\taddr=\(.ServiceAddress // .Address)\tport=\(.ServicePort)\ttags=\(.ServiceTags|join(" | "))"' \
              || echo "(failed)"
            echo
          done

      - name: Consul health state
        run: |
          set -uo pipefail
          echo "--- non-passing health checks ---"
          curl -sS --max-time 25 "http://192.168.0.203:8500/v1/health/state/any" \
            | jq -r '.[]? | select(.Status != "passing") | "\(.Node)\t\(.ServiceName)\t\(.CheckID)\t\(.Status)\t\(.Output[0:120])"' \
            || echo "(failed)"

      - name: Nomad view
        run: |
          set -uo pipefail
          echo "--- nodes ---"
          curl -sS --max-time 20 http://192.168.0.202:4646/v1/nodes \
            | jq -r '.[]? | "\(.Name)\t\(.Address)\tclass=\(.NodeClass)\tstatus=\(.Status)\telev=\(.SchedulingEligibility)\tdrivers=\([.Drivers//{}|to_entries[]|select(.value.Healthy)|.key]|join(","))"' \
            || echo "(failed)"
          echo
          echo "--- jobs (all statuses) ---"
          curl -sS --max-time 20 http://192.168.0.202:4646/v1/jobs \
            | jq -r '.[]? | "\(.ID)\tdc=\(.Datacenters|join(","))\tstatus=\(.Status)"' || echo "(failed)"
          echo
          echo "--- lookout allocations ---"
          curl -sS --max-time 20 http://192.168.0.202:4646/v1/job/lookout/allocations \
            | jq -r '.[]? | "\(.ID[0:8])\tclient=\(.ClientStatus)\tnode=\(.NodeName)\tdesired=\(.DesiredStatus)"' \
            || echo "(failed)"
          echo
          echo "--- lookout task states / events ---"
          curl -sS --max-time 20 http://192.168.0.202:4646/v1/job/lookout/allocations \
            | jq -r '.[]? | .TaskStates // {} | to_entries[]? | "\(.key)\tstate=\(.value.State)\tfailed=\(.value.Failed)\trestarts=\(.value.Restarts)"' \
            || echo "(failed)"

      # Nomad only writes services into consul if its own consul integration is
      # healthy on the client running the alloc, so check the client side too.
      - name: Nomad client consul integration
        run: |
          set -uo pipefail
          echo "--- nomad agent self (consul block, as the server sees it) ---"
          curl -sS --max-time 20 http://192.168.0.202:4646/v1/agent/self \
            | jq '{consul: (.config.Consuls // .config.Consul), datacenter: .config.Datacenter, region: .config.Region}' \
            || echo "(failed)"
          echo
          echo "--- service registrations known to nomad natively ---"
          curl -sS --max-time 20 http://192.168.0.202:4646/v1/services \
            | jq -r '.[]? | .Services[]? | "\(.ServiceName)"' || echo "(failed)"

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
