name: Preview

on:
  - pull_request

concurrency:
  group: pr-infra-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        run: sudo netbird up --setup-key ${{ secrets.NB_SETUP_KEY }}

      - name: Wait for Netbird peer connection
        run: |
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then
              echo "Netbird connected"
              break
            fi
            echo "Waiting for Netbird... ($i/30)"
            sleep 2
          done

      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: dev
          comment-on-pr: true
          comment-on-summary: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          HOSTED: "true"

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
