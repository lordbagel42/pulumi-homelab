name: Rebuild cloudflared + restore nomad jobs (one-shot)

# Public ingress is down (all hostnames return Cloudflare 530) because nomad has
# ZERO jobs registered — including oracle-cloudflared, the tunnel connector,
# which was Running:1 earlier today. Rebuilding nomad-server wiped the raft
# state holding every registration, and the earlier recovery refresh could not
# reach nomad ("no route to host") so those job resources stayed in Pulumi state
# as though they still existed.
#
# Nomad is reachable now, so refresh correctly marks them absent and up
# recreates them. Then verify the public hostnames end-to-end.
#
# Delete once public access is confirmed restored.

on:
  push:
    branches:
      - claude/failed-deployment-recovery-fa5moq
  workflow_dispatch:

concurrency:
  group: deploy-infra

jobs:
  restore:
    name: Destroy orphan 204, refresh, up, verify public
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install

      - name: Install Netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      - name: Connect Netbird
        env:
          NB_SETUP_KEY: ${{ secrets.NB_SETUP_KEY }}
        run: sudo netbird up --setup-key "$NB_SETUP_KEY"

      - name: Wait for Netbird peer connection
        run: |
          for i in $(seq 1 30); do
            if sudo netbird status | grep -q "Connected"; then echo connected; exit 0; fi
            sleep 2
          done
          echo "::error::Netbird failed to connect"; exit 1

      - name: Nomad job count before
        run: |
          curl -sS --max-time 12 http://192.168.0.202:4646/v1/jobs | jq 'length' || true

      # CT 204 exists in Proxmox but not in Pulumi, and its rootfs volume is
      # gone (pre-start hook failure, disk: 0). Pulumi is about to create vmId
      # 204 for the new cloudflared module, which would collide with the orphan,
      # so remove the broken shell first. It is stopped and unmanaged, and its
      # 2G rootfs held nothing but an unprovisioned Debian.
      - name: Destroy the orphaned CT 204 so vmId 204 is free
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          get() { pulumi config get "$1" --stack homelab 2>/dev/null || true; }
          ENDPOINT="$(get PROXMOX_NETBIRD_ENDPOINT)"
          PVE_USER="$(get PROXMOX_USERNAME)"
          PVE_PASS="$(get PROXMOX_PASSWORD)"
          HOST="$(printf '%s' "$ENDPOINT" | sed -E 's#^https?://##; s#/.*$##')"
          echo "::add-mask::$HOST"; echo "::add-mask::${HOST%%:*}"
          [ -n "$PVE_PASS" ] && echo "::add-mask::$PVE_PASS"
          [ -n "$PVE_USER" ] && echo "::add-mask::$PVE_USER"
          API="https://${HOST%%:*}:8006"

          TJ=$(curl -sk --max-time 20 -d "username=$PVE_USER" --data-urlencode "password=$PVE_PASS" \
                 "$API/api2/json/access/ticket")
          T=$(printf '%s' "$TJ" | jq -r '.data.ticket // empty')
          C=$(printf '%s' "$TJ" | jq -r '.data.CSRFPreventionToken // empty')
          if [ -z "$T" ]; then echo "::error::Proxmox API login failed"; exit 1; fi
          echo "::add-mask::$T"; echo "::add-mask::$C"

          st=$(curl -sk --max-time 20 -H "Cookie: PVEAuthCookie=$T" \
                 "$API/api2/json/nodes/optiplex/lxc/204/status/current" | jq -r '.data.status // "absent"')
          echo "CT 204 status: $st"
          if [ "$st" = "absent" ]; then
            echo "already gone, nothing to do"
            exit 0
          fi
          if [ "$st" = "running" ]; then
            echo "::error::CT 204 is running unexpectedly; refusing to destroy"
            exit 1
          fi

          curl -sk --max-time 60 -X DELETE \
            -H "Cookie: PVEAuthCookie=$T" -H "CSRFPreventionToken: $C" \
            "$API/api2/json/nodes/optiplex/lxc/204?purge=1&destroy-unreferenced-disks=1"
          echo
          for i in $(seq 1 30); do
            st=$(curl -sk --max-time 20 -H "Cookie: PVEAuthCookie=$T" \
                   "$API/api2/json/nodes/optiplex/lxc/204/status/current" | jq -r '.data.status // "absent"')
            [ "$st" = "absent" ] && { echo "CT 204 destroyed"; exit 0; }
            sleep 4
          done
          echo "::error::CT 204 still present after destroy"; exit 1

      # Nomad answers now, so this run genuinely reconciles the job resources
      # instead of erroring on them.
      - name: Pulumi refresh
        uses: pulumi/actions@v6
        with:
          command: refresh
          stack-name: homelab
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          HOSTED: "true"

      - name: Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: homelab
          comment-on-summary: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          HOSTED: "true"

      - name: Nomad jobs and cloudflared allocation after
        if: always()
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          n() { curl -sS --max-time 15 "http://192.168.0.202:4646$1"; }
          echo "===== jobs ====="
          n /v1/jobs | jq -r '.[]? | "\(.ID)\tdc=\(.Datacenters|join(","))\tstatus=\(.Status)"' || true
          echo
          echo "===== homelab cloudflared service (CT 204) ====="
          # cloudflared is an outbound connector, so there is nothing to curl.
          # Ask systemd directly.
          pulumi config get SSH_PRIVATE_KEY --stack homelab > /tmp/id_pve 2>/dev/null || true
          chmod 600 /tmp/id_pve
          if [ -s /tmp/id_pve ]; then
            timeout -k 5 40 ssh -i /tmp/id_pve -o StrictHostKeyChecking=no \
              -o ConnectTimeout=8 -o BatchMode=yes root@192.168.0.204 \
              'systemctl is-active cloudflared; systemctl is-enabled cloudflared; cloudflared --version' \
              2>&1 || echo "(ssh to 192.168.0.204 failed)"
          else
            echo "(no ssh key available)"
          fi
          echo
          echo "===== oracle-cloudflared allocations ====="
          n /v1/job/oracle-cloudflared/allocations \
            | jq -r '.[]? | "\(.ID[0:8])\tclient=\(.ClientStatus)\tnode=\(.NodeName)"' || true

      - name: Verify public hostnames
        if: always()
        run: |
          set -uo pipefail
          # cloudflared needs a moment to connect and register the tunnel.
          sleep 45
          rc=0
          for h in auth.bagelindustries.com consul.bagelindustries.com \
                   nomad.bagelindustries.com demo.bagelindustries.com \
                   dokploy.raygen.dev hellonomad.raygen.dev lookout.raygen.dev; do
            code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "https://$h/" 2>/dev/null || echo 000)
            printf '%-34s HTTP %s\n' "$h" "$code"
            # 530 means no tunnel connector; anything else means ingress works
            # (401/403/404 from authentik or traefik are fine here).
            case "$code" in 530|000) rc=1 ;; esac
          done
          if [ "$rc" -ne 0 ]; then
            echo "::warning::at least one hostname still has no working tunnel"
          fi

      - name: Disconnect Netbird
        if: always()
        run: sudo netbird down
